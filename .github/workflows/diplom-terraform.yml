name: Diplom Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/diplom-terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/diplom-terraform.yml"
  workflow_dispatch:
    inputs:
      command:
        description: "Terraform command"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

concurrency:
  group: diplom-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_CLI_CONFIG_FILE: ${{ github.workspace }}/terraform.rc
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_BACKEND_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_BACKEND_SECRET_KEY }}
  TF_VAR_cloud_id: ${{ vars.YC_CLOUD_ID }}
  TF_VAR_folder_id: ${{ vars.YC_FOLDER_ID }}
  TF_VAR_kubernetes_service_account_id: ${{ vars.KUBERNETES_SERVICE_ACCOUNT_ID }}

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    env:
      YC_SERVICE_ACCOUNT_KEY_FILE: /tmp/authorized_key.json

    defaults:
      run:
        working-directory: terraform/infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Configure Yandex Cloud credentials
        env:
          YC_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
        run: |
          umask 077
          printf '%s' "$YC_KEY_JSON" > "$YC_SERVICE_ACCOUNT_KEY_FILE"

      - name: Check formatting
        run: terraform fmt -check -recursive .

      - name: Initialize Terraform
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Validate configuration
        run: terraform validate

      - name: Create plan
        run: terraform plan -out=tfplan

      - name: Apply changes
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.command == 'apply')
        run: terraform apply -auto-approve tfplan

      - name: Destroy infrastructure
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'destroy'
        run: terraform destroy -auto-approve
