<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дипломный проект</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.22), transparent 34%),
        radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.15), transparent 30%),
        #0f172a;
    }

    main {
      width: min(720px, 100%);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid #334155;
      border-radius: 22px;
      background: rgba(15, 23, 42, 0.82);
      box-shadow: 0 28px 80px rgba(2, 6, 23, 0.45);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 12px;
      border: 1px solid #166534;
      border-radius: 999px;
      color: #bbf7d0;
      background: rgba(22, 101, 52, 0.18);
      font-size: 14px;
    }

    .status::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 14px #22c55e;
    }

    h1 {
      margin: 28px 0 14px;
      color: #f8fafc;
      font-size: clamp(36px, 7vw, 62px);
      line-height: 1.04;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: #94a3b8;
      font-size: 18px;
      line-height: 1.7;
    }

    dl {
      margin: 36px 0 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    dl div {
      padding: 16px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: #111c31;
    }

    dt {
      margin-bottom: 6px;
      color: #64748b;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    dd {
      margin: 0;
      color: #dbeafe;
      font-size: 15px;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      dl { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <span class="status">Сервис работает</span>
    <h1>Дипломный проект</h1>
    <p>Тестовое приложение развёрнуто в Managed Kubernetes и доступно через публичный ingress-контроллер.</p>
    <dl>
      <div>
        <dt>Платформа</dt>
        <dd>Yandex Cloud</dd>
      </div>
      <div>
        <dt>Оркестрация</dt>
        <dd>Kubernetes</dd>
      </div>
      <div>
        <dt>Версия</dt>
        <dd>__APP_VERSION__</dd>
      </div>
    </dl>
  </main>
</body>
</html>
